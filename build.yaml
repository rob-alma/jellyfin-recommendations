version: "0.4.3.0"
targetAbi: "10.11.0.0"
framework: "net9.0"
overview: "Personalized recommendations based on watch history"
description: >
  Builds a per-user taste profile from previously watched movies and series
  (genres, cast, crew, studios) and shows a "Recommended For You" row on the
  home screen for every user, kept up to date on a schedule and after
  playback.
category: "General"
owner: "robalma7"
artifacts:
- "Jellyfin.Plugin.PersonalRecommendations.dll"
- "Jellyfin.Plugin.PersonalRecommendations.Core.dll"
- "Newtonsoft.Json.dll"
changelog: >
  0.4.3: Fixed the black screen from 0.4.2 not actually being the
  swipe-back gesture on Android - it was a fast fling (fine slow, broke
  when flicked and released), a known rendering issue with CSS
  scroll-snap on some Android WebView versions. Removed
  scroll-snap-type/scroll-snap-align from the row.
  0.4.2: Fixed a black screen on mobile when swiping right past the start
  of the recommendations row - the browser was interpreting the swipe at
  the scroll boundary as its own edge-swipe-back navigation gesture.
  Added overscroll-behavior-x: contain and touch-action: pan-x so the row
  keeps the gesture instead of passing it to the page.
  0.4.1: Poster images now render as real <img> elements with lazy loading
  and async decoding instead of CSS background-images, matching how native
  rows load - previously every card's image was requested immediately
  regardless of visibility, competing for bandwidth and loading slower as
  a batch.
  0.4.0: Resource-usage pass. Added a single shared gate so the plugin
  never runs its scoring work on more than one thread at a time, whichever
  of the scheduled task / playback-triggered refresh / API cache-miss
  warm-up triggered it. Each user's watch data is now fetched once per
  refresh instead of twice. The library scan is reused for a few minutes
  across nearby triggers. "Refresh automatically after playback" now
  defaults to off.
  0.3.5: Added left/right scroll arrow buttons next to the row heading
  (hidden automatically when there's nothing to scroll to on that side),
  matching the native Continue Watching row.
  0.3.4: The "see all" overlay grid now centers each row instead of
  leaving a sparse, left-aligned last row when the item count doesn't
  evenly fill it.
  0.3.3: Fixed a 504 the widget could trigger on
  GET /Recommendations/{userId} shortly after every restart - the cache was
  empty until the scheduled task's interval trigger first fired, so the
  endpoint fell back to computing live, slow enough on a real library to
  trip a reverse proxy's timeout. The scheduled task now also runs on
  server startup, and the endpoint never blocks on a cache miss: it
  returns immediately and warms the cache in the background. Removed the
  widget script's diagnostic console logging now that the root cause is
  fixed.
  0.3.2: Fixed the widget not appearing on a confirmed 10.11.11 build - the
  home screen's row container is added by React after the home tab itself,
  and the previous DOM-change detection was too narrow to catch that
  moment. It now reacts to any DOM/class change on the page (still cheap
  and debounced) instead of specific nodes/attributes.
  0.3.1: Added diagnostic console logging.
  0.3.0: Replaced the private playlist with a "Recommended For You" home
  screen widget (web/app clients) - series now show as themselves instead of
  their next unwatched episode. Existing pre-0.3.0 playlists are
  automatically removed on first startup after upgrading.
  0.2.1: Non-blocking refresh.
  0.2.0: Switched from collections to playlists (superseded by 0.3.0).
  0.1.0: Initial release.
