version: "0.2.0.0"
targetAbi: "10.11.0.0"
framework: "net9.0"
overview: "Personalized recommendations based on watch history"
description: >
  Builds a per-user taste profile from previously watched movies and series
  (genres, cast, crew, studios) and maintains a private "Recommended For You"
  playlist for each user, kept up to date on a schedule and after playback.
category: "General"
owner: "robalma7"
artifacts:
- "Jellyfin.Plugin.PersonalRecommendations.dll"
- "Jellyfin.Plugin.PersonalRecommendations.Core.dll"
changelog: >
  0.2.0: Switched from collections to playlists for delivering
  recommendations - Jellyfin collections ignore per-user visibility, so they
  were showing up for every user instead of staying private. Playlists have a
  real owner and are private by default; recommended series are represented
  by their next unwatched episode so a series doesn't get expanded into every
  episode. 0.1.0: Initial release.
