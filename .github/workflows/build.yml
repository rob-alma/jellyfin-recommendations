name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: |
          dotnet restore Jellyfin.Plugin.PersonalRecommendations.Core/Jellyfin.Plugin.PersonalRecommendations.Core.csproj
          dotnet restore Jellyfin.Plugin.PersonalRecommendations/Jellyfin.Plugin.PersonalRecommendations.csproj
          dotnet restore Jellyfin.Plugin.PersonalRecommendations.Tests/Jellyfin.Plugin.PersonalRecommendations.Tests.csproj

      - name: Build plugin (net9.0)
        run: dotnet build Jellyfin.Plugin.PersonalRecommendations/Jellyfin.Plugin.PersonalRecommendations.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test Jellyfin.Plugin.PersonalRecommendations.Tests/Jellyfin.Plugin.PersonalRecommendations.Tests.csproj --configuration Release --no-restore
